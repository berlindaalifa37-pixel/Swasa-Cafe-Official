<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swasa Cafe Official - Link in Bio</title>
    <!-- Menggunakan font Google premium & elegan -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4ece1; /* Latar belakang luar */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Wadah halaman utama (Menyesuaikan warna tema Welcome Screen) */
        .phone-container {
            background-color: #f9f5ee; /* Warna Krem/Beige Lembut Swasa Cafe */
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0px 10px 40px rgba(139, 126, 114, 0.15);
        }

        @media (min-width: 480px) {
            .phone-container {
                min-height: 855px;
                border-radius: 32px;
                margin: 20px 0;
                overflow: hidden;
                border: 10px solid #2d2621; /* Bingkai tampilan desktop mewah */
            }
        }

        /* Bagian Profil Atas */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px 16px 24px;
        }

        /* Efek Ornamen Lingkaran Tipis Elegan di Belakang Logo */
        .logo-ring {
            width: 130px;
            height: 130px;
            border: 1px solid #dccbba;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .logo-wrapper {
            width: 112px;
            height: 112px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 6px 20px rgba(163, 145, 129, 0.15);
            overflow: hidden;
            padding: 6px;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Konten Utama Teks */
        .content-section {
            padding: 10px 28px 40px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .welcome-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 26px;
            color: #8b6e56; /* Warna cokelat emas tipis klasik */
            margin-bottom: 2px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #4a3b32; /* Cokelat Gelap khas Swasa Cafe */
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-align: center;
        }

        .description {
            font-size: 13.5px;
            color: #7a6a5e;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 36px;
            max-width: 320px;
        }

        /* Kumpulan Tombol Tautan */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Tombol Cokelat Elegan dan Estetik */
        .btn-link {
            width: 100%;
            background-color: #4a3b32; /* Dasar Cokelat Gelap */
            color: #f9f5ee;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
            box-shadow: 0px 4px 15px rgba(74, 59, 50, 0.15);
            border: 1px solid transparent;
        }

        .btn-link:hover {
            background-color: #ffffff;
            color: #4a3b32;
            border: 1px solid #4a3b32;
            transform: translateY(-2px);
            box-shadow: 0px 6px 20px rgba(74, 59, 50, 0.1);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        .arrow-icon {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Footer Hak Cipta */
        .footer {
            margin-top: auto;
            padding-top: 48px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #a39385;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Bagian Atas Logo (Mengarah langsung ke file gambar Anda di GitHub) -->
        <div class="profile-section">
            <div class="logo-ring">
                <div class="logo-wrapper">
                    <img src="image_b9622be1.jpg" alt="Swasa Cafe Logo">
                </div>
            </div>
        </div>

        <!-- Bagian Pengisian Informasi Menu & Tombol -->
        <div class="content-section">
            <span class="welcome-text">Welcome to</span>
            <h1>SWASA CAFE</h1>
            <p class="description">
                Hadirkan pengalaman minum kopi spesial dari Swasa Cafe di hari bahagia Anda. Hubungi kami untuk informasi paket, menu, dan reservasi slot tanggal.
            </p>

            <div class="links-wrapper">
                <!-- Tombol Kontak WhatsApp Menggunakan Alternatif Universal Link yang Lebih Stabil -->
                <a href="https://whatsapp.com." target="_blank" class="btn-link">
                    <div class="btn-content">
                        <span class="btn-icon">💬</span>
                        <span>Tanya Paket Coffee Stall</span>
                    </div>
                    <span class="arrow-icon">❯</span>
                </a>

                <!-- Tombol Kontak Instagram -->
                <a href="https://instagram.com" target="_blank" class="btn-link">
                    <div class="btn-content">
                        <span class="btn-icon">📸</span>
                        <span>Instagram</span>
                    </div>
                    <span class="arrow-icon">❯</span>
                </a>

                <!-- Tombol Kontak TikTok -->
                <a href="https://tiktok.com" target="_blank" class="btn-link">
                    <div class="btn-content">
                        <span class="btn-icon">🎵</span>
                        <span>TikTok</span>
                    </div>
                    <span class="arrow-icon">❯</span>
                </a>
            </div>

            <div class="footer">
                SWASA CAFE EST. 2023
            </div>
        </div>
    </div>

</body>
</html>
